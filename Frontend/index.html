<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Credible</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="css/style.css">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui; }

    body {
      min-height: 100vh;
      background: radial-gradient(ellipse at bottom,#0b3b75 0%,#05070c 60%);
      color: white;
    }

    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 40px;
    }

    .logo { font-weight: 700; font-size: 18px; }

    .navbar nav a {
      margin: 0 12px;
      color: #cbd5e1;
      text-decoration: none;
      font-size: 14px;
    }

    .navbar nav a:hover { color: #fff; }

    .auth { display: flex; align-items: center; }

    .ghost, .primary {
      display: inline-block;
      text-decoration: none;
      margin-left: 10px;
      border-radius: 8px;
      padding: 8px 12px;
    }

    .ghost { color: #cbd5e1; }

    .primary {
      background: #3b82f6;
      color: white;
      font-weight: 600;
    }

    .hero {
      text-align: center;
      padding: 80px 20px;
    }

    .hero h1 { font-size: 56px; font-weight: 800; }

    .hero h1 span { color: #60a5fa; }

    .hero p {
      margin-top: 12px;
      color: #94a3b8;
      font-size: 18px;
    }

    .prompt-box {
      margin: 40px auto;
      max-width: 680px;
      padding: 18px;
      background: rgba(17,24,39,0.6);
      backdrop-filter: blur(14px);
      border-radius: 35px;
    }

    textarea {
      width: 100%;
      height: 80px;
      background: transparent;
      border: none;
      color: white;
      outline: none;
    }

    .build {
      background: #3b82f6;
      color: white;
      padding: 10px 18px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
    }
  </style>
</head>

<body>

<header class="navbar">
  <div class="logo">📰 Credible</div>

  <nav>
    <a href="how_it_works.html">How It Works</a>
    <a href="model.html">ML Model</a>
    <a href="dataset.html">Dataset</a>
    <a href="team.html">Team</a>
  </nav>

  <!-- ✅ Dynamic Auth Section -->
  <div class="auth" id="authSection"></div>
</header>

<main class="hero">
  <h1>Is This News <span>Credible</span>?</h1>

  <p>An AI-powered system that analyzes news content using NLP to classify it as fake or credible.</p>

  <div class="prompt-box">
    <textarea id="newsInput" placeholder="Paste news here..."></textarea>

    <div style="margin-top:10px;">
      <button class="build">Detect →</button>
    </div>

    <div id="result"></div>
  </div>
</main>

<script>
// ================= NAVBAR =================
function loadNavbar() {
  const auth = document.getElementById("authSection");

  const isLoggedIn = localStorage.getItem("loggedIn");
  const user = localStorage.getItem("currentUser");

  if (isLoggedIn === "true" && user) {
    auth.innerHTML = `
      <span>👤 ${user}</span>
      <button onclick="logout()">Logout</button>
    `;
  } else {
    auth.innerHTML = `
      <a href="login.html" class="ghost">Sign in</a>
      <a href="signup.html" class="primary">Get started</a>
    `;
  }
}

function logout() {
  localStorage.removeItem("loggedIn");
  localStorage.removeItem("currentUser");
  location.reload();
}

// ================= DETECT =================
const textarea = document.getElementById("newsInput");
const buildBtn = document.querySelector(".build");

buildBtn.addEventListener("click", async () => {
  const newsText = textarea.value.trim();

  if (!newsText) {
    alert("Enter news");
    return;
  }

  buildBtn.innerText = "Analyzing...";
  buildBtn.disabled = true;

  try {
    const res = await fetch("http://127.0.0.1:5000/predict", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ news: newsText })
    });

    const data = await res.json();

    document.getElementById("result").innerHTML = `
      <h3>${data.verdict}</h3>
      <p>${data.confidence}%</p>
      <p>${data.explanation}</p>
    `;
  } catch {
    alert("Error");
  }

  buildBtn.innerText = "Detect →";
  buildBtn.disabled = false;
});

// INIT
loadNavbar();
</script>

</body>
